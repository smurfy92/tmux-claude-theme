# Install guide
# - write this file in ~/.tmux.conf
# - use this command : tmux source ~/.tmux.conf
# - in tmux install plugins via prefix + I in this case ` + I
# - you should be ready to go


# prefix
unbind C-b
set-option -g prefix `
bind-key ` send-prefix


# reload conf
bind r source-file ~/.tmux.conf


#general options
set -g @continuum-restore 'on'
set -g mouse on


# === Thème Catppuccin Mocha — réglages manuels (indépendants du plugin) ===
# La barre de sélection (ligne surlignée) dans choose-tree / copy-mode.
# Lavande Catppuccin sur texte foncé pour un bon contraste.
set -g mode-style "fg=#1e1e2e,bg=#b4befe,bold"

# Couleurs des messages / ligne de commande, pour rester cohérent.
set -g message-style "fg=#cdd6f4,bg=#313244"
set -g message-command-style "fg=#cdd6f4,bg=#313244"

# Menus (prefix + clic droit) assortis à la même palette.
set -g menu-style "fg=#cdd6f4,bg=#1e1e2e"
set -g menu-selected-style "fg=#1e1e2e,bg=#b4befe,bold"
set -g menu-border-style "fg=#b4befe"

# Bordures de panes en lavande/surface.
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#b4befe"

# --- Status bar Catppuccin Mocha (manuelle, sans plugin) ---
# Placée AVANT le run de tpm : tmux-continuum vient ainsi ajouter son
# hook de sauvegarde à status-right sans qu'on le perde.
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# Nom de session à gauche (badge lavande).
set -g status-left-length 32
set -g status-left "#[fg=#1e1e2e,bg=#b4befe,bold] #S #[fg=#b4befe,bg=#1e1e2e,nobold] "

# Date/heure à droite ; indicateur PREFIX en rouge quand le préfixe est actif.
set -g status-right-length 80
# Badge sessions Claude (#( ) ré-évalué toutes les status-interval = 5s) :
#   ◆ N rouge = N Claude attendent ta réponse · ◐ N pêche = N au travail.
# Le même script rafraîchit aussi @cc_state, donc choose-tree reste à jour.
set -g status-right "#(~/.tmux/scripts/cc-states.sh)#{?client_prefix,#[fg=#f38ba8]#[bold]⌨ PREFIX #[nobold]#[default] ,}#[fg=#a6adc8] %d/%m #[fg=#1e1e2e]#[bg=#b4befe]#[bold] %H:%M "

# Onglets de windows : on masque les fenêtres INACTIVES (navigation via choose-tree)
# et on ne garde que la fenêtre courante au centre, pour savoir où on est.
set -g window-status-separator ""
set -g window-status-format ""
set -g window-status-current-format "#[fg=#1e1e2e]#[bg=#cba6f7]#[bold] #I:#W #[default]"
set -g window-status-activity-style "fg=#f9e2af,bg=#313244"
set -g window-status-bell-style "fg=#f38ba8,bg=#313244"

# Horloge (prefix + t).
set -g clock-mode-colour "#b4befe"


# === choose-tree : état des sessions Claude par couleur ===
# Le titre de pane ne suffit pas : "fini" (idle) et "attend ta réponse" (waiting)
# affichent tous deux ✳. On délègue donc la classification à
# ~/.tmux/scripts/cc-states.sh (lancé juste avant choose-tree), qui capture le bas
# de chaque pane et pose l'option window @cc_state, lue ici par le format :
#   waiting -> ◆ rouge   (Claude attend une réponse de TA part) <- le plus urgent
#   work    -> ◐ pêche   (Claude travaille, spinner actif)
#   idle    -> ● vert    (Claude a fini / au repos)
#   shell   -> ○ gris    (pas de session Claude)
# Syntaxe : pas de virgule dans les #[...] (#[fg=X]#[bold], pas #[fg=X,bold]),
# sinon le découpage de #{?cond,then,else} casse. choose-tree affiche déjà l'index.
bind w run-shell "~/.tmux/scripts/cc-states.sh >/dev/null 2>&1" \; choose-tree -Zw -F "#{?#{==:#{@cc_state},waiting},#[fg=#f38ba8]◆#[bold] waiting#[nobold] ,#{?#{==:#{@cc_state},work},#[fg=#fab387]◐#[bold] work#[nobold]    ,#{?#{==:#{@cc_state},idle},#[fg=#a6e3a1]● idle#[default]    ,#[fg=#6c7086]○ shell#[default]   }}}#[fg=#cdd6f4]#[bold]#{window_name}#[nobold]#{window_flags} #[fg=#6c7086]#{pane_title}"
bind s run-shell "~/.tmux/scripts/cc-states.sh >/dev/null 2>&1" \; choose-tree -Zs -F "#{?#{==:#{@cc_state},waiting},#[fg=#f38ba8]◆#[bold] waiting#[nobold] ,#{?#{==:#{@cc_state},work},#[fg=#fab387]◐#[bold] work#[nobold]    ,#{?#{==:#{@cc_state},idle},#[fg=#a6e3a1]● idle#[default]    ,#[fg=#6c7086]○ shell#[default]   }}}#[fg=#cdd6f4]#[bold]#{window_name}#[nobold]#{window_flags} #[fg=#6c7086]#{pane_title}"

# prefix + a : saute à la prochaine session Claude qui attend ta réponse (cycle).
bind a run-shell "~/.tmux/scripts/cc-jump.sh"

# Extended keys (CSI u) : laisse passer Shift+Enter, Ctrl+Enter, etc.
# au programme enfant (ex : Claude Code pour les multilignes).
# Nécessite que le terminal parent (iTerm2) ait « Report modifiers using CSI u »
# activé : iTerm2 → Settings → Profiles → Keys → General.
set -s extended-keys always
set -as terminal-features 'xterm*:extkeys'


#plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

#tmux plugin manager
run '~/.tmux/plugins/tpm/tpm'
